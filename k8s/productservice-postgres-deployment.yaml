apiVersion: apps/v1
kind: Deployment
metadata:
  name: productservice-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: productservice-postgres
  template:
    metadata:
      labels:
        app: productservice-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: ProductDb
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: productservice-postgres-pvc