apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderservice-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orderservice-postgres
  template:
    metadata:
      labels:
        app: orderservice-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: OrderDb
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: orderservice-postgres-pvc