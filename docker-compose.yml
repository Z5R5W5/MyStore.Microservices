services:
 

  api-gateway:
    build:
      context: .
      dockerfile: ApiGateway.Dockerfile

    container_name: productservice-gateway

    ports:
      - "8081:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080

    depends_on:
      productservice:
        condition: service_started

      orderservice:
        condition: service_started

      notificationservice:
        condition: service_started
  notificationservice:
    build:
      context: .
      dockerfile: NotificationService.Dockerfile

    container_name: notificationservice-api

    ports:
      - "8083:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080

      MongoDb__ConnectionString: "mongodb://mongodb:27017"
      MongoDb__DatabaseName: "NotificationDb"
      MongoDb__CollectionName: "Notifications"

      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: "guest"
      RabbitMQ__Password: "guest"
      RabbitMQ__Exchange: "orders"
      RabbitMQ__Queue: "order-created"
      RabbitMQ__RoutingKey: "order.created"

    depends_on:
      rabbitmq:
        condition: service_healthy

      mongodb:
        condition: service_started

  orderservice:
    build:
      context: .
      dockerfile: OrderService.Dockerfile

    container_name: orderservice-api

    ports:
      - "8082:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080

      ConnectionStrings__OrderConnection: "Host=orderservice-postgres;Port=5432;Database=OrderDb;Username=postgres;Password=postgres"

      Services__ProductService: "http://productservice:8080"

      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: "guest"
      RabbitMQ__Password: "guest"

    depends_on:
      orderservice-postgres:
        condition: service_healthy

      productservice:
        condition: service_started

      rabbitmq:
        condition: service_healthy
  productservice:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: productservice-api

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080

      ConnectionStrings__ProductConnection: "Host=postgres;Port=5432;Database=ProductDb;Username=postgres;Password=postgres"

    depends_on:
      postgres:
        condition: service_healthy


  postgres:
    image: postgres:16-alpine

    container_name: productservice-postgres

    environment:
      POSTGRES_DB: ProductDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - productservice_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ProductDb"]

      interval: 5s
      timeout: 5s
      retries: 5
  orderservice-postgres:
    image: postgres:16-alpine

    container_name: orderservice-postgres

    environment:
      POSTGRES_DB: OrderDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - orderservice_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d OrderDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine

    container_name: mystore-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - notificationservice_mongo_data:/data/db
volumes:
  productservice_postgres_data:
  orderservice_postgres_data:
  notificationservice_mongo_data:
  rabbitmq_data: